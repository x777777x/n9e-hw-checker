# kernel-hw-mon patterns
# 格式（TAB 分隔）:
#   source<TAB><regex>              来源过滤，多个为 OR；未配置则不限制来源
#   include<TAB><category><TAB><regex>  命中即视为异常
#   exclude<TAB><regex>             命中则忽略该行
#
# 注意: 正则使用 ERE（gawk），大小写敏感。

# ---------------------------------------------------------------------------
# 来源过滤: 只信任内核与常见硬件守护进程的日志，避免误匹配应用日志
# ---------------------------------------------------------------------------
source	[[:space:]]kernel:
source	^kernel:
source	[[:space:]]mcelog:
source	[[:space:]]mcelog\[[0-9]+\]:
source	[[:space:]]smartd:
source	[[:space:]]smartd\[[0-9]+\]:
source	[[:space:]]rasdaemon:
source	[[:space:]]ras-mc-ctl:
source	[[:space:]]mdadm:
source	[[:space:]]ipmi:
source	[[:space:]]ipmievd:
source	[[:space:]]ipmitool:
source	[[:space:]]megaraid:
source	[[:space:]]megacli:
source	[[:space:]]storcli:
source	[[:space:]]smartctl:

